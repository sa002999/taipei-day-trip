<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/static/style.css" />
    <title>Member</title>
  </head>
  <body>
    <section id="section-header">
      <header class="site-header">
        <div class="container header-container">
          <a href="/" class="logo">台北一日遊</a>
          <nav class="main-nav">
            <a href="/booking" class="nav-link booking-link">預定行程</a>
            <a href="/member" class="nav-link"> 會員中心 </a>
          </nav>
        </div>
      </header>
    </section>
    <section id="member-details" class="member-section">
      <div class="container member-container">
        <h2 class="greeting">會員中心</h2>
        <div class="separator"></div>
        <div class="mcp-info">
          <h2>AI工具整合</h2>
          <p>MCP伺服器設定</p>
          <ul>
            <li>Host URL</li>
            <p id="host-url">載入中...</p>
            <li>Bear Token</li>
            <p id="bearer-token">尚未產生金鑰</p>
          </ul>
        </div>
        <button class="token-btn" id="token-btn">產生/更新金鑰</button>
        <div class="separator"></div>
        <button class="logout-btn" id="logout-btn">登出會員</button>
      </div>
    </section>
    <section id="section-footer">
      <footer class="site-footer">
        <div class="container footer-container">
          <p>COPYRIGHT © 2021 台北一日遊</p>
        </div>
      </footer>
    </section>

    <section id="section-signup-modal" class="modal-overlay">
      <div class="dialog-box">
        <div class="decorator-bar"></div>
        <button class="close-btn" aria-label="關閉">
          <img src="/static/img/icon_close.png" alt="Close Icon" />
        </button>
        <div class="dialog-content">
          <h2 class="dialog-title">註冊會員帳號</h2>
          <form class="signup-form" action="#" method="POST">
            <div class="input-group">
              <input type="text" placeholder="輸入姓名" aria-label="輸入姓名" required />
            </div>
            <div class="input-group">
              <input type="email" placeholder="輸入電子郵件" aria-label="輸入電子郵件" required />
            </div>
            <div class="input-group">
              <input type="password" placeholder="輸入密碼" aria-label="輸入密碼" required />
            </div>
            <button type="submit" class="submit-btn">註冊新帳戶</button>
            <p class="form-message" role="alert" aria-live="polite"></p>
            <a href="#section-login-modal" class="login-link">已經有帳戶了？點此登入</a>
          </form>
        </div>
      </div>
    </section>

    <section id="section-login-modal" class="modal-overlay">
      <div class="dialog-box">
        <div class="decorator-bar"></div>
        <button class="close-btn" aria-label="關閉">
          <img src="/static/img/icon_close.png" alt="關閉" />
        </button>
        <div class="dialog-content">
          <h2 class="dialog-title">登入會員帳號</h2>
          <form class="login-form" action="#" method="POST">
            <div class="input-group">
              <input type="email" placeholder="輸入電子郵件" aria-label="輸入電子郵件" required />
            </div>
            <div class="input-group">
              <input type="password" placeholder="輸入密碼" aria-label="輸入密碼" required />
            </div>
            <button type="submit" class="submit-btn">登入帳戶</button>
            <p class="form-message" role="alert" aria-live="polite"></p>
            <a href="#section-signup-modal" class="login-link"> 還沒有帳戶？點此註冊 </a>
          </form>
        </div>
      </div>
    </section>

    <script src="/static/script.js"></script>
  </body>
</html>
