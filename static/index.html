<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/static/style.css" />
    <title>Index</title>
  </head>
  <body>
    <section id="section-header">
      <header class="site-header">
        <div class="container header-container">
          <a href="/" class="logo">台北一日遊</a>
          <nav class="main-nav">
            <a href="#" class="nav-link">預定行程</a>
            <a
              href="#section-login-modal"
              class="nav-link"
              id="login-register-link"
            >
              登入/註冊
            </a>
          </nav>
        </div>
      </header>
    </section>

    <section id="section-hero">
      <div class="hero-section">
        <div class="hero-bg">
          <img src="/static/img/welcome image.png" alt="Taipei Scenery" />
        </div>
        <div class="container hero-content">
          <div class="hero-text">
            <h1 class="hero-title">輕鬆享受台北一日悠閒</h1>
            <p class="hero-subtitle">探索每個角落，體驗城市的深度旅遊行程</p>
          </div>
          <div class="search-bar">
            <div class="search-category" role="button" tabindex="0">
              <span>全部分類 ▼</span>
            </div>
            <div class="category-menu hidden"></div>
            <div class="search-input-wrapper">
              <input
                type="text"
                class="search-input"
                placeholder="輸入景點名稱查詢"
              />
            </div>
            <button class="search-btn">
              <img src="/static/img/search.png" alt="Search" />
            </button>
          </div>
        </div>
      </div>
    </section>

    <section id="section-main">
      <div class="main-section">
        <div class="container">
          <!-- List Bar -->
          <div class="list-bar-container">
            <button class="scroll-btn left-btn">
              <img src="/static/img/arrow left.png" alt="Scroll Left" />
            </button>
            <div class="list-bar"></div>
            <button class="scroll-btn right-btn">
              <img src="/static/img/arrow right.png" alt="Scroll Right" />
            </button>
          </div>

          <!-- Attractions Grid -->
          <div class="attractions-grid"></div>
        </div>
      </div>
    </section>

    <section id="section-footer">
      <footer class="site-footer">
        <div class="container footer-container">
          <p>COPYRIGHT © 2021 台北一日遊</p>
        </div>
      </footer>
    </section>

    <section id="section-signup-modal" class="modal-overlay">
      <div class="dialog-box">
        <div class="decorator-bar"></div>
        <button class="close-btn" aria-label="關閉">
          <img src="/static/img/icon_close.png" alt="Close Icon" />
        </button>
        <div class="dialog-content">
          <h2 class="dialog-title">註冊會員帳號</h2>
          <form class="signup-form" action="#" method="POST">
            <div class="input-group">
              <input
                type="text"
                placeholder="輸入姓名"
                aria-label="輸入姓名"
                required
              />
            </div>
            <div class="input-group">
              <input
                type="email"
                placeholder="輸入電子郵件"
                aria-label="輸入電子郵件"
                required
              />
            </div>
            <div class="input-group">
              <input
                type="password"
                placeholder="輸入密碼"
                aria-label="輸入密碼"
                required
              />
            </div>
            <button type="submit" class="submit-btn">註冊新帳戶</button>
            <p class="form-message" role="alert" aria-live="polite"></p>
            <a href="#section-login-modal" class="login-link"
              >已經有帳戶了？點此登入</a
            >
          </form>
        </div>
      </div>
    </section>

    <section id="section-login-modal" class="modal-overlay">
      <div class="dialog-box">
        <div class="decorator-bar"></div>
        <button class="close-btn" aria-label="關閉">
          <img src="/static/img/icon_close.png" alt="關閉" />
        </button>
        <div class="dialog-content">
          <h2 class="dialog-title">登入會員帳號</h2>
          <form class="login-form" action="#" method="POST">
            <div class="input-group">
              <input
                type="email"
                placeholder="輸入電子郵件"
                aria-label="輸入電子郵件"
                required
              />
            </div>
            <div class="input-group">
              <input
                type="password"
                placeholder="輸入密碼"
                aria-label="輸入密碼"
                required
              />
            </div>
            <button type="submit" class="submit-btn">登入帳戶</button>
            <p class="form-message" role="alert" aria-live="polite"></p>
            <a href="#section-signup-modal" class="login-link">
              還沒有帳戶？點此註冊
            </a>
          </form>
        </div>
      </div>
    </section>

    <script src="/static/script.js"></script>
  </body>
</html>
